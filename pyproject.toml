[project]
name = "webpier"
version = "0.1.0"
description = "WebPier: railway pier design calculations (0500-0720) and calculation reports"
requires-python = ">=3.12"
dependencies = [
    "gridlayoutpdf",
    "pymupdf>=1.24,<2",
    "reportlab>=5.0.1,<6",
    "tksheet>=7.6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pypdf>=5,<7"]

[tool.uv]
package = false

[tool.uv.sources]
gridlayoutpdf = { path = "C:/Users/sasai/Documents/GridLayoutPdf" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
