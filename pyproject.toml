[project]
name = "webpier"
version = "0.1.0"
description = "WebPier: railway pier design calculations (0500-0720) and calculation reports"
requires-python = ">=3.12"
dependencies = [
    "gridlayoutpdf",
    "openpyxl>=3.1,<4",
    "pymupdf>=1.24,<2",
    "pypdf>=5,<7",
    "reportlab>=5.0.1,<6",
    "tksheet>=7.6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "coverage>=7.10,<8", "hypothesis>=6.100,<7"]

[tool.uv]
package = false

[tool.uv.sources]
gridlayoutpdf = { path = "C:/Users/sasai/Documents/GridLayoutPdf" }

[tool.coverage.run]
branch = true
source = ["webpier"]
parallel = true
# The pipeline and PDF tests run python -m webpier and python -c in child processes.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
